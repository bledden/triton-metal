name: CI

# GPU / Metal correctness is validated LOCALLY, not in hosted CI. Triton publishes no
# macOS wheels, and building it from source on a GitHub-hosted macOS runner exceeds the
# runner time limit (>60 min — it never finishes), so the Triton-dependent suite can't run
# on hosted runners. Before pushing, run `pytest tests/` on Apple Silicon with a
# source-built Triton (the suite is 1,968 / 0). See CONTRIBUTING.md "Testing". Hosted CI
# therefore gates on lint only; for automated GPU coverage, register a self-hosted macOS
# runner and add a `runs-on: [self-hosted, macOS, ARM64]` test job that runs `pytest tests/`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Lint
        run: ruff check triton_msl/ tests/
