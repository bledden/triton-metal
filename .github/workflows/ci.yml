name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Lint
        run: ruff check triton_msl/ tests/

  test:
    runs-on: macos-14  # M1 Apple Silicon with Metal GPU
    timeout-minutes: 60  # first run builds Triton from source (~20-30 min); cached afterward
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # reuse the built Triton wheel across runs (avoids rebuilding)

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # default macOS arm64 wheel ships the MPS backend; the CPU-only index disabled
          # Metal entirely, so the "GPU" tests never actually ran on the GPU.
          pip install torch

      - name: Install Triton (built from source — Triton publishes no macOS wheels)
        run: |
          pip install ninja cmake wheel
          pip install -U git+https://github.com/triton-lang/triton.git
        # Deliberately NOT continue-on-error: a failed Triton install must fail loudly here,
        # not be masked into a green step that then hard-errors every test on `import triton`.

      - name: Install test dependencies
        run: pip install transformers torchvision
        continue-on-error: true  # Optional for model validation tests

      - name: Run unit tests
        run: pytest tests/ -v --timeout=120 -m "not slow and not stress"

      - name: Run stress tests
        run: pytest tests/test_stress.py -v --timeout=180

      - name: Run GPU correctness tests
        run: pytest tests/test_gpu_correctness.py -v --timeout=60

      - name: Performance regression check
        run: python benchmarks/bench_regression.py
        continue-on-error: true  # Advisory until perf baseline is stable

      - name: Upstream Triton subset (smoke test)
        run: |
          python scripts/run_upstream_tests.py \
            --test-file test_core.py \
            --report-dir reports/ \
            --timeout 600
        continue-on-error: true  # Informational, not gating

      - name: Check upstream regression
        run: python scripts/check_upstream_regression.py --report-dir reports/

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
