name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 (Node 24)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VER" || { echo "::error::tag $TAG does not match pyproject version $VER"; exit 1; }
          echo "tag $TAG matches package version $VER"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (Node 24)
        with:
          name: dist
          path: dist/

  test-install:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (Node 24)
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: '3.12'

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Verify import
        run: python -c "import triton_msl; print('triton_msl imported successfully')"

  publish-testpypi:
    needs: test-install
    runs-on: ubuntu-latest
    environment: testpypi
    # Best-effort dry run only. TestPyPI lags real PyPI on Metadata-Version 2.4 (PEP 639
    # `License-Expression`) and 400s on artifacts PyPI accepts (verified: a1 is live on PyPI
    # with license_expression). Its own lag must not block the real release below.
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (Node 24)
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [test-install, publish-testpypi]
    # Runs after the TestPyPI dry run but is NOT gated by it (test-install is the real gate);
    # PyPI validates independently and fails safe if anything is actually wrong.
    if: ${{ always() && needs.test-install.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (Node 24)
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
