[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The obvious `triton-metal` (and close variants like
# `tritonmetal`) is taken on PyPI by an unrelated project and blocked by PyPI's
# PEP 541 confusability check, so this ships as `triton-msl` — a distinct stem
# (MSL = Metal Shading Language, which this backend emits). Import name: triton_msl.
name = "triton-msl"
version = "0.1.0a1"
description = "Metal (Apple Silicon) backend for Triton"
readme = "README.md"
# PEP 639 SPDX expression (Metadata-Version 2.4). Do NOT also add a
# `License :: OSI Approved :: ...` classifier — PyPI rejects the combination of
# a license expression and a license classifier (400 Bad Request).
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Blake Ledden", email = "bledden@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Metal>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-MetalPerformanceShaders>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
triton = [
    "triton==3.7.0",
    # torch.mps.compile_shader (the zero-copy MPS fast path) needs >=2.5; the
    # torch.compile / inductor integration is developed + tested against 2.12.
    "torch>=2.12.0",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/bledden/triton-msl"
Repository = "https://github.com/bledden/triton-msl"
Issues = "https://github.com/bledden/triton-msl/issues"
Changelog = "https://github.com/bledden/triton-msl/blob/main/CHANGELOG.md"

[project.entry-points."triton.backends"]
metal = "triton_msl.backend"

[tool.setuptools.packages.find]
include = ["triton_msl*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "stress: marks stress tests (deselect with '-m \"not stress\"')",
    "benchmark: marks benchmark tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# The codebase has a deliberate compact style (inline semicolons in kernels/tests,
# math-style index names l/I, f-string MSL template literals). These rules are noise
# against it; the meaningful checks (F811 redefinition, real F-codes, W) stay on.
ignore = [
    "E401",  # multiple imports on one line
    "E402",  # module-level import not at top (guarded `import triton` blocks)
    "E501",  # line too long (codegen emits long MSL template lines)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon) — compact kernel/test style
    "E703",  # statement ends with a semicolon
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name (l/I/O — index/math convention)
    "F401",  # imported but unused (re-exports + side-effect registration imports)
    "F541",  # f-string without placeholders (MSL template literals)
    "F841",  # local variable assigned but never used (readability intermediates)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # tests redefine same-named kernels across cases by design
